# Strict golangci-lint v2 config. Copy to the repo root as `.golangci.yml`.
#
# Substitute both occurrences of MODULE_PATH with the module path from go.mod,
# and set `run.go` to the `go` directive in go.mod.
#
# Verify after editing:  golangci-lint config verify
# Adopt on an existing codebase without a 3000-line first run:
#   golangci-lint run --new-from-merge-base=origin/main

version: "2"

run:
  go: "1.24"          # match the `go` directive in go.mod; the default is 1.17
  timeout: 5m         # the 1m default trips on large module graphs
  tests: true
  modules-download-mode: readonly   # a lint run must never edit go.mod

linters:
  # `standard` = errcheck, govet, ineffassign, staticcheck, unused.
  # Never use `all`: it contains mutually contradictory linters.
  default: standard

  enable:
    # --- correctness -------------------------------------------------------
    - asasalint               # []any passed to a variadic ...any parameter
    - bodyclose               # HTTP response bodies that are never closed
    - canonicalheader         # non-canonical net/http.Header keys
    - contextcheck            # a function that drops the caller's context
    - copyloopvar             # pre-1.22 loop-variable copies, now redundant
    - durationcheck           # multiplying two Durations
    - errchkjson              # types the json encoders cannot marshal
    - errorlint               # %v instead of %w, == instead of errors.Is
    - exhaustive              # enum switches missing a case
    - exptostd                # golang.org/x/exp calls with a stdlib equivalent
    - fatcontext              # context rebuilt inside a loop
    - forcetypeassert         # x.(T) without the ok form
    - gocheckcompilerdirectives  # `// go:generate` and other silently-dead directives
    - makezero                # make([]T, n) then append
    - mirror                  # the bytes API used on a string, and vice versa
    - musttag                 # struct marshalled without tags on every field
    - nilerr                  # `if err != nil { return nil }`
    - nilnesserr              # err != nil, but a *different* nil error returned
    - noctx                   # requests built without a context
    - reassign                # assignment to a package-level var of another package
    - recvcheck               # one type mixing pointer and value receivers
    - rowserrcheck            # sql.Rows.Err() never checked
    - sqlclosecheck           # unclosed sql.Rows / sql.Stmt
    - unconvert               # redundant type conversions
    - wastedassign            # values assigned and never read

    # --- security ----------------------------------------------------------
    - gosec

    # --- clarity -----------------------------------------------------------
    - errname                 # error vars named ErrFoo, types named FooError
    - goconst                 # repeated string literals that want a constant
    - gocritic
    - misspell
    - modernize               # constructs with a newer stdlib equivalent
    - nakedret                # naked returns in anything but a tiny function
    - predeclared             # shadowing `len`, `cap`, `new`, …
    - revive
    - sloglint                # one calling style for log/slog
    - unparam                 # parameters and results that are always the same
    - usestdlibvars           # http.MethodGet instead of "GET"

    # --- performance -------------------------------------------------------
    - intrange                # `for i := range n` (1.22+)
    - perfsprint              # fmt.Sprintf where strconv or concatenation works

    # --- tests -------------------------------------------------------------
    - testifylint             # swapped want/got, Equal on errors
    - thelper                 # helpers missing t.Helper()
    - tparallel               # t.Parallel() misuse
    - usetesting              # os.Setenv where t.Setenv exists

    # --- keeps the config itself honest -------------------------------------
    - nolintlint

    # Deliberately noisy. Enable one at a time, with a reason:
    # - exhaustruct_v5        # every struct literal must set every field
    # - gochecknoglobals
    # - gochecknoinits        # init() runs before main can decide anything
    # - ireturn               # return concrete types, accept interfaces
    # - lll
    # - funlen
    # - cyclop
    # - varnamelen
    # - wrapcheck             # wrap every error crossing a package boundary
    # - paralleltest          # every test must call t.Parallel()
    # - testpackage           # tests live in package foo_test, using only the API
    # - prealloc              # append in a loop over a known length
    # - godoclint             # doc comments that do not follow godoc form
    # - depguard              # requires a `rules:` policy under settings

  settings:
    errcheck:
      check-type-assertions: true   # catches x.(T) panics
      check-blank: true             # catches `_ = doSomething()`

    govet:
      enable-all: true
      disable:
        - fieldalignment            # struct-padding advice; churn without a profile

    staticcheck:
      checks:
        - all

    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      # `opinionated` and `experimental` are opt-in; add them once the rest is clean.

    revive:
      enable-default-rules: true    # includes var-naming, error-strings, errorf, exported
      rules:
        - name: early-return
        - name: unnecessary-stmt
        - name: use-any
        - name: unchecked-type-assertion
        - name: datarace
        - name: defer
        - name: context-as-argument
        - name: time-naming
        - name: identical-branches
        - name: modifies-value-receiver
        - name: package-comments
          disabled: true            # demands a doc comment on every package

    gosec:
      excludes:
        - G104                      # duplicate of errcheck

    exhaustive:
      default-signifies-exhaustive: true

    misspell:
      locale: US

    nakedret:
      max-func-lines: 5             # a naked return is only readable in a short function

    sloglint:
      no-mixed-args: true           # never mix key-value pairs and slog.Attr in one call
      static-msg: true              # the message is a constant; the data goes in attrs
      key-naming-case: snake        # one key vocabulary, so the logs are queryable

    nolintlint:
      require-explanation: true     # //nolint must say why
      require-specific: true        # //nolint must name the linter
      allow-unused: false           # a //nolint that suppresses nothing is dead

  exclusions:
    generated: strict               # never lint generated code
    warn-unused: true               # tell me when an exclusion stops matching
    presets:
      - comments
      - std-error-handling
      - common-false-positives
    rules:
      # Test files trade some rigor for readability.
      - path: '_test\.go'
        linters:
          - dupl
          - errcheck
          - funlen
          - goconst
          - gosec

formatters:
  enable:
    - gofumpt                       # stricter gofmt — see references/gofumpt.md
    - goimports                     # import grouping; do not also enable gci
  settings:
    gofumpt:
      module-path: MODULE_PATH
      # extra-rules rewrites code, not just whitespace (naked returns, grouped
      # params, balanced call parens). Land it in its own commit.
      extra-rules: false
      # Or enable them one at a time:
      # extra:
      #   group-params: true
      #   clothe-returns: true
      #   balance-calls: true
    goimports:
      local-prefixes:
        - MODULE_PATH
  exclusions:
    generated: strict

issues:
  # The defaults (50 per linter, 3 per message) silently truncate the report,
  # which is exactly wrong on a first run. 0 means no cap.
  max-issues-per-linter: 0
  max-same-issues: 0

output:
  formats:
    text:
      path: stdout
  show-stats: true
  sort-order:
    - linter
    - file
